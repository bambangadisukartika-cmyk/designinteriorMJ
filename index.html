    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const ROOM_SIZE_PRESETS = [
      { id: 'small-25x3', label: 'Kecil / Kost (2.5 × 3 m)', length: '3.0', width: '2.5', ceiling: '2.8' },
      { id: 'std-3x3', label: 'Standar (3 × 3 m)', length: '3.0', width: '3.0', ceiling: '3.0' },
      { id: 'med-3x4', label: 'Sedang (3 × 4 m)', length: '4.0', width: '3.0', ceiling: '3.0' },
      { id: 'large-4x5', label: 'Luas (4 × 5 m)', length: '5.0', width: '4.0', ceiling: '3.2' }
    ];

    const ROOM_TYPES = [
      { id: 'living-room', name: 'Ruang Tamu / Keluarga', promptName: 'Living Room' },
      { id: 'bedroom', name: 'Kamar Tidur', promptName: 'Master Bedroom' },
      { id: 'kitchen-dining', name: 'Dapur & Ruang Makan', promptName: 'Kitchen and Dining Area' },
      { id: 'home-office', name: 'Ruang Kerja / Studio', promptName: 'Home Office Workspace' },
      { id: 'bathroom', name: 'Kamar Mandi', promptName: 'Modern Bathroom' },
      { id: 'cafe-commercial', name: 'Kafe / Ruang Usaha', promptName: 'Boutique Cafe Interior' }
    ];

    const INTERIOR_STYLES = [
      {
        id: 'japandi',
        name: 'Japandi Natural',
        desc: 'Minimalis Jepang & Skandinavia, kayu hangat, bersih & tenang.',
        keywords: 'Japandi interior design style, warm light oak wood, neutral beige tones, low-profile minimalist furniture, clean lines, indoor plants',
        previewColors: ['#F5F2EB', '#D8C8B8', '#8C6D53', '#2C2A29']
      },
      {
        id: 'modern-luxury',
        name: 'Modern Luxury',
        desc: 'Elegan dengan marmer, lampu LED tersembunyi, & material mewah.',
        keywords: 'Modern Luxury interior, white calacatta marble accents, brushed brass gold fixtures, plush velvet upholstery, warm cove lighting',
        previewColors: ['#1C1917', '#44403C', '#D4AF37', '#F5F5F4']
      },
      {
        id: 'tropical-indo',
        name: 'Tropis Modern',
        desc: 'Kayu jati, rotan alami, sirkulasi terang, & tanaman tropis segar.',
        keywords: 'Modern Tropical resort interior, warm teak wood, woven rattan textures, lush indoor tropical plants, airy bright natural ventilation',
        previewColors: ['#FAF8F5', '#B47B44', '#2D5A27', '#4A3B32']
      },
      {
        id: 'wabi-sabi',
        name: 'Wabi-Sabi Earthy',
        desc: 'Tekstur dinding organik, warna tanah lembut, & artistik.',
        keywords: 'Wabi-Sabi organic modern interior, textured limewash walls, earthy terracotta and sand palette, curved bouclé sofa, raw natural stone',
        previewColors: ['#E6DEC8', '#C2A88E', '#9C6B4E', '#3D352E']
      }
    ];

    const LIGHTING_MOODS = [
      { id: 'daylight', name: 'Cahaya Siang Alami', prompt: 'bright natural morning daylight streaming through windows' },
      { id: 'golden-hour', name: 'Sore Hangat (Golden Hour)', prompt: 'warm golden hour sunlight casting soft long shadows, cozy glow' },
      { id: 'cozy-night', name: 'Malam Hangat (Warm LED)', prompt: 'cozy evening ambiance with warm 3000K hidden LED strip lighting' }
    ];

    const COLOR_THEMES = [
      { id: 'warm-neutral', name: 'Krem & Kayu Hangat', prompt: 'warm cream, oatmeal, beige, and natural oak wood tones', swatches: ['#F7F3EB', '#DFD3C3', '#B89F80', '#5C4938'] },
      { id: 'sage-botanic', name: 'Hijau Sage & Alami', prompt: 'soft sage green, warm white, muted olive, and light walnut', swatches: ['#F4F6F0', '#A3B19B', '#5E7153', '#8C6239'] },
      { id: 'monochrome-lux', name: 'Monokrom Elegan', prompt: 'charcoal grey, crisp white, warm taupe, and matte black accents', swatches: ['#F8FAFC', '#94A3B8', '#334155', '#0F172A'] }
    ];

    const RENOVATION_MODES = [
      {
        id: 'keep-structure',
        name: 'Kunci Presisi Struktur & Ukuran 1:1',
        promptRule: 'STRICT ARCHITECTURAL & SCALE LOCK: Do NOT make the room look wider or larger than the raw photo. Preserve the exact 1:1 wall boundaries, corner angles, ceiling height, and window frames.'
      }
    ];

    async function fetchWithRetry(url, options, maxRetries = 3) {
      let delay = 1000;
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          const response = await fetch(url, options);
          if (response.ok) return await response.json();
          if (response.status !== 429 && response.status < 500) {
            const errText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errText}`);
          }
        } catch (err) {
          if (attempt === maxRetries - 1) throw err;
        }
        await new Promise((resolve) => setTimeout(resolve, delay));
        delay *= 2;
      }
      throw new Error('Gagal terhubung ke AI server.');
    }

    function generateSampleRawRoomDataUrl(type = 'empty') {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 768;
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const bx1 = W * 0.22, by1 = H * 0.18, bx2 = W * 0.78, by2 = H * 0.68;

      ctx.fillStyle = '#e7e5e4';
      ctx.fillRect(0, 0, W, H / 2);
      ctx.fillStyle = '#78716c';
      ctx.fillRect(0, H / 2, W, H / 2);

      ctx.fillStyle = '#dedad4';
      ctx.fillRect(bx1, by1, bx2 - bx1, by2 - by1);

      ctx.strokeStyle = 'rgba(68, 64, 60, 0.25)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i <= 8; i++) {
        const topX = bx1 + ((bx2 - bx1) * i) / 8;
        const botX = -W * 0.2 + (W * 1.4 * i) / 8;
        ctx.beginPath();
        ctx.moveTo(topX, by2);
        ctx.lineTo(botX, H);
        ctx.stroke();
      }

      ctx.strokeStyle = '#57534e';
      ctx.lineWidth = 6;
      ctx.strokeRect(bx1, by1, bx2 - bx1, by2 - by1);

      const winW = (bx2 - bx1) * 0.45;
      const winH = (by2 - by1) * 0.55;
      const winX = bx1 + (bx2 - bx1 - winW) / 2;
      const winY = by1 + (by2 - by1) * 0.15;
      ctx.fillStyle = '#bae6fd';
      ctx.fillRect(winX, winY, winW, winH);
      ctx.strokeStyle = '#44403c';
      ctx.lineWidth = 6;
      ctx.strokeRect(winX, winY, winW, winH);

      if (type === 'messy') {
        ctx.fillStyle = '#b48352';
        ctx.fillRect(W * 0.55, H * 0.55, 120, 80);
      }

      return canvas.toDataURL('image/jpeg', 0.9);
    }

    function App() {
      const [rawImage, setRawImage] = useState(null);
      const [generatedImage, setGeneratedImage] = useState(null);
      const [designAnalysis, setDesignAnalysis] = useState(null);

      const [selectedRoom, setSelectedRoom] = useState(ROOM_TYPES[0]);
      const [selectedStyle, setSelectedStyle] = useState(INTERIOR_STYLES[0]);
      const [selectedLighting, setSelectedLighting] = useState(LIGHTING_MOODS[0]);
      const [selectedColorTheme, setSelectedColorTheme] = useState(COLOR_THEMES[0]);
      const [customNotes, setCustomNotes] = useState('');
      const [revisionPrompt, setRevisionPrompt] = useState('');

      const [roomLength, setRoomLength] = useState('3.5');
      const [roomWidth, setRoomWidth] = useState('3.0');
      const [ceilingHeight, setCeilingHeight] = useState('3.0');
      const [spatialPins, setSpatialPins] = useState([]);
      const [isPinMode, setIsPinMode] = useState(false);
      const [pendingPin, setPendingPin] = useState(null);
      const [isScanningRoom, setIsScanningRoom] = useState(false);
      const [roomScanSummary, setRoomScanSummary] = useState(null);
      const [xrayOpacity, setXrayOpacity] = useState(45);

      const [isGenerating, setIsGenerating] = useState(false);
      const [loadingStep, setLoadingStep] = useState('');
      const [viewMode, setViewMode] = useState('slider');
      const [sliderPos, setSliderPos] = useState(50);
      const [isDraggingSlider, setIsDraggingSlider] = useState(false);
      const [toast, setToast] = useState(null);
      const [activeRightPanel, setActiveRightPanel] = useState('canvas'); // 'canvas' | 'blueprint'
      const [showShareModal, setShowShareModal] = useState(false);

      const fileInputRef = useRef(null);
      const sliderContainerRef = useRef(null);
      const rawPreviewRef = useRef(null);

      const showToast = useCallback((message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      }, []);

      const processFile = (file) => {
        if (!file || !file.type.startsWith('image/')) {
          showToast('Pilih file gambar yang valid (JPG/PNG).', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          const [header, base64] = dataUrl.split(',');
          const mimeMatch = header.match(/data:(.*?);/);
          setRawImage({
            dataUrl,
            base64,
            mimeType: mimeMatch ? mimeMatch[1] : 'image/jpeg',
            name: file.name
          });
          setGeneratedImage(null);
          setDesignAnalysis(null);
          setSpatialPins([]);
          setRoomScanSummary(null);
          showToast('Foto ruangan mentah berhasil dimuat!');
        };
        reader.readAsDataURL(file);
      };

      const handleLoadSampleRoom = (type = 'empty') => {
        const sampleDataUrl = generateSampleRawRoomDataUrl(type);
        const [, base64] = sampleDataUrl.split(',');
        setRawImage({
          dataUrl: sampleDataUrl,
          base64,
          mimeType: 'image/jpeg',
          name: type === 'empty' ? 'Sampel_Ruang_Kosong.jpg' : 'Sampel_Ruangan_Lama.jpg'
        });
        setGeneratedImage(null);
        setDesignAnalysis(null);
        setSpatialPins([]);
        setRoomScanSummary(null);
        showToast('Sampel ruangan berhasil dimuat!');
      };

      const handleRawImageClickForPin = (e) => {
        if (!isPinMode || !rawPreviewRef.current) return;
        const rect = rawPreviewRef.current.getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        setPendingPin({ x, y, zone: y < 35 ? 'Area Dinding/Plafon' : 'Area Lantai/Furnitur', note: '' });
      };

      const handleScanRoomGeometry = async () => {
        if (!rawImage) {
          showToast('Unggah foto ruangan terlebih dahulu!', 'error');
          return;
        }
        setIsScanningRoom(true);
        try {
          const apiKey = '';
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const res = await fetchWithRetry(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                role: 'user',
                parts: [
                  { text: 'Analisis foto ruangan ini dan berikan estimasi Panjang (estimatedLengthM), Lebar (estimatedWidthM), Plafon (estimatedCeilingM), dan saran skala.' },
                  { inlineData: { mimeType: rawImage.mimeType, data: rawImage.base64 } }
                ]
              }],
              generationConfig: {
                responseMimeType: 'application/json',
                responseSchema: {
                  type: 'OBJECT',
                  properties: {
                    estimatedLengthM: { type: 'STRING' },
                    estimatedWidthM: { type: 'STRING' },
                    estimatedCeilingM: { type: 'STRING' },
                    maxFurnitureScaleAdvice: { type: 'STRING' }
                  },
                  required: ['estimatedLengthM', 'estimatedWidthM', 'estimatedCeilingM', 'maxFurnitureScaleAdvice']
                }
              }
            })
          });
          const text = res?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            const parsed = JSON.parse(text);
            setRoomScanSummary(parsed);
            if (parsed.estimatedLengthM) setRoomLength(parsed.estimatedLengthM.replace(/[^0-9.]/g, '') || '3.5');
            if (parsed.estimatedWidthM) setRoomWidth(parsed.estimatedWidthM.replace(/[^0-9.]/g, '') || '3.0');
            if (parsed.estimatedCeilingM) setCeilingHeight(parsed.estimatedCeilingM.replace(/[^0-9.]/g, '') || '3.0');
            showToast('Kalibrasi otomatis berhasil!');
          }
        } catch (e) {
          showToast('Gagal memindai otomatis.', 'error');
        } finally {
          setIsScanningRoom(false);
        }
      };

      const updateSliderPosition = useCallback((clientX) => {
        if (!sliderContainerRef.current) return;
        const rect = sliderContainerRef.current.getBoundingClientRect();
        const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
        setSliderPos(Math.round((x / rect.width) * 100));
      }, []);

      useEffect(() => {
        const handleMove = (e) => { if (isDraggingSlider) updateSliderPosition(e.clientX); };
        const handleTouchMove = (e) => { if (isDraggingSlider && e.touches?.[0]) updateSliderPosition(e.touches[0].clientX); };
        const handleUp = () => setIsDraggingSlider(false);

        if (isDraggingSlider) {
          window.addEventListener('mousemove', handleMove);
          window.addEventListener('touchmove', handleTouchMove);
          window.addEventListener('mouseup', handleUp);
          window.addEventListener('touchend', handleUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('touchmove', handleTouchMove);
          window.removeEventListener('mouseup', handleUp);
          window.removeEventListener('touchend', handleUp);
        };
      }, [isDraggingSlider, updateSliderPosition]);

      const handleGenerateInterior = async (isRevision = false, customText = '') => {
        if (!rawImage) {
          showToast('Unggah foto ruangan terlebih dahulu!', 'error');
          return;
        }
        setIsGenerating(true);
        setIsPinMode(false);
        setPendingPin(null);

        try {
          const apiKey = '';
          const textUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const imageUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;

          setLoadingStep(isRevision ? 'Menyiapkan revisi tata letak...' : 'Menganalisis proporsi ruangan...');

          const analysisRes = await fetchWithRetry(textUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                role: 'user',
                parts: [
                  { text: `Rancang interior ${selectedRoom.name}, ukuran ${roomLength}x${roomWidth}m, gaya ${selectedStyle.name} (${selectedStyle.keywords}).` },
                  { inlineData: { mimeType: rawImage.mimeType, data: rawImage.base64 } }
                ]
              }],
              generationConfig: {
                responseMimeType: 'application/json',
                responseSchema: {
                  type: 'OBJECT',
                  properties: {
                    conceptTitle: { type: 'STRING' },
                    roomDiagnosis: { type: 'STRING' },
                    wallAndFloorSpec: { type: 'STRING' },
                    lightingPlan: { type: 'STRING' },
                    furnitureList: {
                      type: 'ARRAY',
                      items: {
                        type: 'OBJECT',
                        properties: { item: { type: 'STRING' }, dimensionsCm: { type: 'STRING' }, material: { type: 'STRING' } },
                        required: ['item', 'dimensionsCm', 'material']
                      }
                    }
                  },
                  required: ['conceptTitle', 'roomDiagnosis', 'wallAndFloorSpec', 'lightingPlan', 'furnitureList']
                }
              }
            })
          });

          const textData = analysisRes?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (textData) setDesignAnalysis(JSON.parse(textData));

          setLoadingStep('Merender visual akhir...');
          const imgRes = await fetchWithRetry(imageUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                role: 'user',
                parts: [
                  { text: isRevision ? `Edit interior: ${customText}` : `Redesign this raw room into ${selectedStyle.name} (${selectedStyle.keywords}). Keep strict 1:1 room size ${roomLength}x${roomWidth}m.` },
                  { inlineData: { mimeType: rawImage.mimeType, data: rawImage.base64 } }
                ]
              }],
              generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
            })
          });

          const imgPart = imgRes?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
          if (!imgPart?.inlineData?.data) throw new Error('Gagal merender gambar.');

          setGeneratedImage(`data:${imgPart.inlineData.mimeType || 'image/png'};base64,${imgPart.inlineData.data}`);
          setViewMode('slider');
          if (isRevision) setRevisionPrompt('');
          showToast('Desain selesai dirender!');
        } catch (e) {
          showToast('Gagal memproses AI render.', 'error');
        } finally {
          setIsGenerating(false);
          setLoadingStep('');
        }
      };

      const handleExportSingleHtml = () => {
        const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `AutoInterior-Studio-${Date.now()}.html`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('File HTML mandiri berhasil diunduh!');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border backdrop-blur-md ${toast.type === 'error' ? 'bg-rose-950/90 border-rose-500/50 text-rose-200' : 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200'}`}>
              <span className="text-sm font-medium">{toast.message}</span>
            </div>
          )}

          {/* Share Modal */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Panduan Share ke GitHub & Netlify</h3>
                  <button onClick={() => setShowShareModal(false)} className="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
                  <p>1. Klik tombol <strong>"Export ke Satu File HTML"</strong> untuk mengunduh aplikasi ini.</p>
                  <p>2. Ubah nama file yang diunduh menjadi <strong>index.html</strong>.</p>
                  <p>3. Buat Repository baru di <a href="https://github.com" target="_blank" className="text-sky-400 underline">GitHub</a> lalu unggah file <em>index.html</em> tersebut.</p>
                  <p>4. Buka <a href="https://drop.netlify.com" target="_blank" className="text-sky-400 underline">Netlify Drop</a> dan seret file HTML Anda ke sana agar langsung online gratis!</p>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={handleExportSingleHtml} className="px-4 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">Export HTML Sekarang</button>
                </div>
              </div>
            </div>
          )}

          {/* Header */}
          <header className="h-16 border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md px-4 lg:px-6 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-lg shadow-amber-500/20 text-slate-950 font-black">AI</div>
              <div>
                <h1 className="text-base font-bold tracking-tight text-white">AutoInterior AI Studio</h1>
                <p className="text-xs text-slate-400 hidden sm:block">Professional AI Architectural Interior Remodeling</p>
              </div>
            </div>
            <div className="flex items-center gap-2.5">
              <button onClick={() => setShowShareModal(true)} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition">
                <span>Cara Share ke GitHub & Netlify</span>
              </button>
              <button onClick={handleExportSingleHtml} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold transition">
                <span>Export ke HTML</span>
              </button>
            </div>
          </header>

          {/* Content */}
          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
            {/* Sidebar Controls */}
            <aside className="w-full lg:w-[410px] xl:w-[440px] border-b lg:border-b-0 lg:border-r border-slate-800/80 bg-slate-900/50 flex flex-col lg:h-[calc(100vh-4rem)] overflow-y-auto p-5 space-y-6">
              {/* Upload Section */}
              <div className="space-y-2.5">
                <label className="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                  <span className="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-[11px]">1</span>
                  Foto Ruangan Mentah
                </label>
                <input ref={fileInputRef} type="file" accept="image/*" onChange={(e) => processFile(e.target.files?.[0])} className="hidden" />
                {!rawImage ? (
                  <div onClick={() => fileInputRef.current?.click()} className="border-2 border-dashed border-slate-700 hover:border-amber-500/70 bg-slate-900/90 rounded-2xl p-5 text-center cursor-pointer transition">
                    <p className="text-sm font-semibold text-slate-200">Klik untuk Unggah Foto Ruangan</p>
                    <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-center gap-2" onClick={(e) => e.stopPropagation()}>
                      <button type="button" onClick={() => handleLoadSampleRoom('empty')} className="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-slate-800 text-amber-300 border border-slate-700">Sampel Ruang Kosong</button>
                      <button type="button" onClick={() => handleLoadSampleRoom('messy')} className="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700">Sampel Ruangan Lama</button>
                    </div>
                  </div>
                ) : (
                  <div className="relative rounded-2xl overflow-hidden border border-slate-700 bg-slate-950">
                    <img src={rawImage.dataUrl} alt="Raw" className="w-full h-36 object-cover" />
                    <div className="absolute inset-0 bg-slate-950/60 flex items-end justify-between p-3">
                      <span className="text-xs text-slate-200 truncate">{rawImage.name}</span>
                      <button type="button" onClick={() => setRawImage(null)} className="px-2 py-1 bg-rose-950 text-rose-300 text-xs rounded">Hapus</button>
                    </div>
                  </div>
                )}
              </div>

              {/* Room Calibration */}
              <div className="space-y-3 p-3.5 rounded-2xl bg-slate-950/90 border border-amber-500/30">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-bold uppercase tracking-wider text-amber-400">Kalibrasi Ukuran (Panjang × Lebar × Tinggi)</label>
                  {rawImage && (
                    <button type="button" disabled={isScanningRoom} onClick={handleScanRoomGeometry} className="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 text-[11px] font-bold">
                      {isScanningRoom ? 'Memindai...' : 'Ukur Otomatis'}
                    </button>
                  )}
                </div>
                <div className="grid grid-cols-2 gap-1.5">
                  {ROOM_SIZE_PRESETS.map((p) => (
                    <button key={p.id} type="button" onClick={() => { setRoomLength(p.length); setRoomWidth(p.width); setCeilingHeight(p.ceiling); }} className={`px-2.5 py-1.5 rounded-lg text-[11px] font-medium border text-left ${roomLength === p.length && roomWidth === p.width ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>
                      {p.label}
                    </button>
                  ))}
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="text-[10px] text-slate-400 block mb-1">Panjang (m)</label>
                    <input type="number" step="0.1" value={roomLength} onChange={(e) => setRoomLength(e.target.value)} className="w-full rounded-lg bg-slate-900 border border-slate-700 px-2 py-1 text-xs text-white" />
                  </div>
                  <div>
                    <label className="text-[10px] text-slate-400 block mb-1">Lebar (m)</label>
                    <input type="number" step="0.1" value={roomWidth} onChange={(e) => setRoomWidth(e.target.value)} className="w-full rounded-lg bg-slate-900 border border-slate-700 px-2 py-1 text-xs text-white" />
                  </div>
                  <div>
                    <label className="text-[10px] text-slate-400 block mb-1">Plafon (m)</label>
                    <input type="number" step="0.1" value={ceilingHeight} onChange={(e) => setCeilingHeight(e.target.value)} className="w-full rounded-lg bg-slate-900 border border-slate-700 px-2 py-1 text-xs text-white" />
                  </div>
                </div>
              </div>

              {/* Room Type */}
              <div className="space-y-2.5">
                <label className="text-xs font-bold uppercase tracking-wider text-amber-400">2. Fungsi Ruangan</label>
                <div className="grid grid-cols-2 gap-2">
                  {ROOM_TYPES.map((r) => (
                    <button key={r.id} type="button" onClick={() => setSelectedRoom(r)} className={`px-3 py-2 rounded-xl text-left text-xs font-medium border ${selectedRoom.id === r.id ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>
                      {r.name}
                    </button>
                  ))}
                </div>
              </div>

              {/* Styles */}
              <div className="space-y-2.5">
                <label className="text-xs font-bold uppercase tracking-wider text-amber-400">3. Gaya Desain Interior</label>
                <div className="space-y-2">
                  {INTERIOR_STYLES.map((s) => (
                    <button key={s.id} type="button" onClick={() => setSelectedStyle(s)} className={`w-full p-3 rounded-xl text-left border flex items-center justify-between ${selectedStyle.id === s.id ? 'bg-amber-500/20 border-amber-500' : 'bg-slate-900 border-slate-800'}`}>
                      <div>
                        <div className="text-xs font-bold text-white">{s.name}</div>
                        <div className="text-[11px] text-slate-400">{s.desc}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              <button type="button" disabled={isGenerating} onClick={() => handleGenerateInterior(false)} className="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 disabled:opacity-50 text-slate-950 font-extrabold text-sm shadow-xl transition">
                {isGenerating ? loadingStep : 'Render Desain Interior Otomatis'}
              </button>
            </aside>

            {/* Main Preview Area */}
            <main className="flex-1 flex flex-col bg-slate-950 lg:h-[calc(100vh-4rem)] overflow-y-auto">
              <div className="border-b border-slate-800/80 bg-slate-900/40 px-6 py-3 flex items-center justify-between">
                <div className="flex gap-2">
                  <button onClick={() => setActiveRightPanel('canvas')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeRightPanel === 'canvas' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Visual Ruangan</button>
                  <button onClick={() => setActiveRightPanel('blueprint')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeRightPanel === 'blueprint' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Rincian Material & Furnitur</button>
                </div>
                {generatedImage && activeRightPanel === 'canvas' && (
                  <div className="flex gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
                    <button onClick={() => setViewMode('slider')} className={`px-2.5 py-1 rounded text-xs ${viewMode === 'slider' ? 'bg-slate-800 text-amber-400' : 'text-slate-400'}`}>Geser Before/After</button>
                    <button onClick={() => setViewMode('xray')} className={`px-2.5 py-1 rounded text-xs ${viewMode === 'xray' ? 'bg-slate-800 text-amber-400' : 'text-slate-400'}`}>X-Ray Dinding</button>
                  </div>
                )}
              </div>

              <div className="flex-1 p-6 flex flex-col items-center justify-center">
                {activeRightPanel === 'canvas' ? (
                  !rawImage ? (
                    <div className="text-center space-y-4 max-w-md">
                      <h2 className="text-xl font-bold text-white">Mulai Desain Ruangan Anda</h2>
                      <p className="text-xs text-slate-400">Unggah foto ruangan di panel kiri atau gunakan sampel untuk mulai merender.</p>
                    </div>
                  ) : (
                    <div className="w-full max-w-4xl space-y-4">
                      <div className="relative rounded-2xl overflow-hidden border border-slate-800 bg-slate-900 shadow-2xl">
                        {isGenerating && (
                          <div className="absolute inset-0 z-30 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
                            <p className="text-base font-bold text-white">{loadingStep}</p>
                          </div>
                        )}

                        {generatedImage && viewMode === 'slider' ? (
                          <div ref={sliderContainerRef} onMouseDown={(e) => { setIsDraggingSlider(true); updateSliderPosition(e.clientX); }} className="relative w-full cursor-ew-resize overflow-hidden select-none">
                            <img src={generatedImage} alt="Sesudah" className="w-full max-h-[62vh] object-contain mx-auto block bg-slate-950" />
                            <div className="absolute inset-0 overflow-hidden" style={{ clipPath: `inset(0 ${100 - sliderPos}% 0 0)` }}>
                              <img src={rawImage.dataUrl} alt="Sebelum" className="w-full h-full object-contain mx-auto block bg-slate-950" />
                            </div>
                            <div className="absolute top-0 bottom-0 w-1 bg-amber-400" style={{ left: `${sliderPos}%` }}>
                              <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-amber-400 text-slate-950 flex items-center justify-center font-bold">↔</div>
                            </div>
                          </div>
                        ) : generatedImage && viewMode === 'xray' ? (
                          <div className="relative w-full bg-slate-950">
                            <img src={generatedImage} alt="Desain" className="w-full max-h-[62vh] object-contain mx-auto" />
                            <img src={rawImage.dataUrl} alt="Xray" style={{ opacity: xrayOpacity / 100 }} className="absolute inset-0 w-full h-full object-contain mx-auto pointer-events-none" />
                            <div className="absolute bottom-3 left-1/2 -translate-x-1/2 px-3 py-1 rounded bg-slate-950/90 border border-slate-700 flex items-center gap-2">
                              <span className="text-[11px] text-amber-400 font-bold">Transparansi: {xrayOpacity}%</span>
                              <input type="range" min="0" max="100" value={xrayOpacity} onChange={(e) => setXrayOpacity(Number(e.target.value))} className="accent-amber-500" />
                            </div>
                          </div>
                        ) : (
                          <img src={generatedImage || rawImage.dataUrl} alt="Preview" className="w-full max-h-[62vh] object-contain mx-auto block bg-slate-950" />
                        )}
                      </div>

                      {generatedImage && (
                        <div className="rounded-2xl border border-slate-800 bg-slate-900/70 p-3 flex gap-2">
                          <input type="text" value={revisionPrompt} onChange={(e) => setRevisionPrompt(e.target.value)} placeholder="Ketik revisi kilat (Misal: Ganti lantai jadi kayu hangat...)" className="flex-1 rounded-xl bg-slate-950 border border-slate-800 px-3.5 py-2 text-xs text-slate-100" />
                          <button type="button" onClick={() => handleGenerateInterior(true, revisionPrompt)} className="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">Kirim</button>
                        </div>
                      )}
                    </div>
                  )
                ) : (
                  <div className="max-w-4xl w-full space-y-4">
                    {!designAnalysis ? (
                      <div className="text-center p-8">Belum ada rincian material. Render desain terlebih dahulu.</div>
                    ) : (
                      <div className="space-y-4">
                        <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800">
                          <h2 className="text-lg font-bold text-white">{designAnalysis.conceptTitle}</h2>
                          <p className="text-xs text-slate-300 mt-1">{designAnalysis.roomDiagnosis}</p>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                          <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800">
                            <h4 className="text-xs font-bold text-amber-400 mb-1">Lantai & Dinding</h4>
                            <p className="text-xs text-slate-300">{designAnalysis.wallAndFloorSpec}</p>
                          </div>
                          <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800">
                            <h4 className="text-xs font-bold text-amber-400 mb-1">Pencahayaan</h4>
                            <p className="text-xs text-slate-300">{designAnalysis.lightingPlan}</p>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
